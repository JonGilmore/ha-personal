      sequence:
      - action: alert.turn_off
        entity_id: alert.double_garage_door_open
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == "ACKNOWLEDGE_SINGLE_GARAGE_ALERT"
          }}'
      sequence:
      - action: alert.turn_off
        entity_id: alert.single_garage_door_open
    - conditions:
      - condition: template
