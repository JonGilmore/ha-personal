    id: disable_burglar
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: ACKNOWLEDGE_FIRE_ALARM
    id: ack_fire
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.alarm_notifier
  - choose:
    - conditions:
      - condition: trigger
        id: disable_burglar
      sequence:
      - action: script.disarm_elk
      - action: notify.mobile_app_jons_iphone
        data:
          title: ✅ Burglar Alarm Disabled
          message: Panel disarmed via notification.
          data:
            tag: burglar_alarm
    - conditions:
      - condition: trigger
        id: ack_fire
      sequence:
      - action: notify.mobile_app_jons_iphone
        data:
          title: ✅ Fire Alarm Acknowledged
          message: Repeat notifications silenced. Verify physically.
          data:
            tag: fire_alarm
  mode: parallel
