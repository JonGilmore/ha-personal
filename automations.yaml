- id: '1740319066381'
  alias: 'Christmas: generic triggers'
  description: 'at 4:30pm, or if Laura gets home, or when we wake up, turn on the
    xmas lights. at 11pm, or start sleeping, or laura leaves, or laura gets in bed,
    or alarm armed away, turn off xmas lights '
  triggers:
  - trigger: time
    at: '16:30:00'
    id: 430pm
  - trigger: state
    entity_id: person.laura
    to: home
    id: xmason
  - trigger: state
    entity_id: binary_sensor.sleeping
    from: 'on'
    to: 'off'
    id: xmason
  - trigger: time
    at: '23:00:00'
    id: xmasoff-trees
  - trigger: state
    entity_id: binary_sensor.sleeping
    from: 'off'
    to: 'on'
    id: xmasoff-trees
  - trigger: state
    entity_id: person.laura
    to: not_home
    id: xmasoff-trees
  - trigger: state
    entity_id: binary_sensor.bed_presence_bed_occupied_right
    from: 'off'
    to: 'on'
    id: xmasoff-trees
  - trigger: state
    entity_id: binary_sensor.occupied_alarm
    from: 'on'
    to: 'off'
    id: xmasoff-trees
  - trigger: time
    at: '23:00:00'
    id: xmasoff-all
  - trigger: time
    at: '23:30:00'
    id: xmasoff-all
  conditions:
  - condition: state
    entity_id: binary_sensor.christmas_season
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 430pm
      sequence:
      - action: homeassistant.turn_on
        target:
          entity_id:
          - switch.exterior_roof_outlets
          - light.roof_lights_power_switch
        data: {}
      - choose:
          conditions:
          - condition: state
            entity_id: person.laura
            state: home
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.christmas_trees
            data: {}
    - conditions:
      - condition: trigger
        id: xmasoff-trees
      sequence:
      - if:
        - condition: time
          after: 06:00:00
          before: 09:00:00
        then: []
        else:
        - action: light.turn_off
          target:
            entity_id: light.christmas_trees
          data: {}
    - conditions:
      - condition: trigger
        id: xmasoff-all
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.christmas_lights
        data: {}
    - conditions:
      - condition: trigger
        id: xmason
      - condition: time
        before: '23:00:00'
        after: 07:00:00
      sequence:
      - action: notify.mobile_app_jons_iphone
        data:
          message: '{{ trigger.to_state.attributes.friendly_name }} is {{ trigger.to_state.state
            }}. Christmas lights turned on'
      - if:
        - condition: time
          after: 07:00:00
          before: '19:00:00'
        then:
        - action: light.turn_on
          target:
            entity_id: light.christmas_trees
          data: {}
        else:
        - action: light.turn_on
          metadata: {}
          target:
            entity_id: light.main_floor_christmas_lights
          data: {}
  mode: single
