- id: '1740319923404'
  alias: 'Utility: power outage'
  description: ''
  triggers:
  - trigger: state
    entity_id: sensor.cyberpower_ups
    to: ten
    id: ten
    for:
      seconds: 15
  - trigger: state
    entity_id: sensor.cyberpower_ups
    to: five
    id: five
    for:
      seconds: 15
  - trigger: state
    entity_id: sensor.cyberpower_ups
    to: three
    id: three
    for:
      seconds: 30
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: ten
      sequence:
      - action: notify.mobile_app_jons_iphone
        data:
          message: Cyberpower UPS has {{ state('sensor.ups_battery_runtime') | float
            | round(0) }}min remaining.
      - action: shell_command.container_cmd
        data:
          cmd: stop
          container: actual
      - action: shell_command.container_cmd
        data:
          cmd: stop
          container: browserless
      - action: shell_command.container_cmd
        data:
          cmd: stop
          container: datadog
      - action: shell_command.container_cmd
        data:
          cmd: stop
          container: changedetection
      - action: shell_command.container_cmd
        data:
          cmd: stop
          container: paperless-ngx
      - action: shell_command.container_cmd
        data:
          cmd: stop
          container: redis
      - action: shell_command.container_cmd
        data:
          cmd: stop
          container: infinitude
      - action: shell_command.container_cmd
        data:
          cmd: stop
          container: aircon
    - conditions:
      - condition: trigger
        id: five
      sequence:
      - action: notify.mobile_app_jons_iphone
        data:
          message: Cyberpower UPS has {{ state('sensor.ups_battery_runtime') | float
            | round(0) }}min remaining.
    - conditions:
      - condition: trigger
        id: three
      sequence:
      - action: notify.mobile_app_jons_iphone
        data:
          message: Cyberpower UPS has {{ state('sensor.ups_battery_runtime') | float
            | round(0) }}min remaining, turning off HA.
      - action: shell_command.debian_shutdown
        data: {}
  mode: single
