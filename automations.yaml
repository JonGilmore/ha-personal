- id: '1736562512723'
  alias: turn off main floor tvs after 30m of watching in the morning
  description: Automatically turn off the Great Room and Sunroom TVs 30 minutes after
    they turn on between 6:00 AM and 7:45 AM.
  triggers:
  - entity_id:
    - media_player.great_room_tv
    - media_player.sunroom_tv
    to: 'on'
    trigger: state
  conditions:
  - condition: time
    after: 06:00:00
    before: 07:45:00
  actions:
  - delay: 00:30:00
  - condition: template
    value_template: '{{ is_state(trigger.entity_id, ''on'') }}'
    alias: check to make sure that the triggered TV is actually on
  - action: notify.mobile_app_jons_iphone
    data:
      message: Turn off the {{ trigger.to_state.attributes.friendly_name }}?
      data:
        actions:
        - action: TURN_OFF_TV
          title: Turn Off TV
  - wait_for_trigger:
    - event_type: mobile_app_notification_action
      event_data:
        action: TURN_OFF_TV
      trigger: event
  - target:
      entity_id: '{{ trigger.entity_id }}'
    action: media_player.turn_off
  mode: parallel
