  - trigger: numeric_state
    entity_id:
    - sensor.elkm1_workshop_keypad
    below: 55
    for:
      minutes: 15
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: nut_event
      sequence:
      - action: notify.mobile_app_jons_iphone
        data:
          message: 'Power outage detected by UPS: {{ (states(''sensor.ups_battery_runtime'')
            | float / 60) | round(0) }} minutes of battery power remaining.'
    default:
    - action: notify.mobile_app_jons_iphone
