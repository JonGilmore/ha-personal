    event_data:
      action: ACKNOWLEDGE_SINGLE_GARAGE_ALERT
    alias: ACKNOWLEDGE_SINGLE_GARAGE_ALERT
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: SNOOZE_DOUBLE_GARAGE_ALERT
    alias: SNOOZE_DOUBLE_GARAGE_ALERT
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: SNOOZE_SINGLE_GARAGE_ALERT
    alias: SNOOZE_SINGLE_GARAGE_ALERT
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == "CLOSE_DOUBLE_GARAGE_DOOR"
          }}'
