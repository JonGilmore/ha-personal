- id: '1773883250082'
  alias: 'HVAC: morning solar offset request'
  description: check if its going to be mostly sunny. if it is, then send a notification
    to see if i want to set temps back 2°F on the main/upper levels.
  triggers:
  - at: 07:30:00
    trigger: time
  actions:
  - target:
      entity_id: weather.tomorrow_io_home_hourly
    data:
      type: hourly
    response_variable: hourly_data
    action: weather.get_forecasts
  - condition: and
    conditions:
    - condition: or
      conditions:
      - condition: state
        entity_id: climate.infinitude_main_level
        state: heat
      - condition: state
        entity_id: climate.infinitude_upper_level
        state: heat
      alias: check if both main and upper levels are set to heat
    - condition: template
      value_template: '{% set forecast = hourly_data[''weather.tomorrow_io_home_hourly''][''forecast''][:12]
        %} {% set sunny_hours = forecast | selectattr(''condition'', ''in'', [''sunny'',
        ''clear'', ''partlycloudy'']) | list | length %} {{ sunny_hours >= 5 }}

        '
      alias: at least 5 of the next 12hrs are sunny
    - condition: state
      entity_id: binary_sensor.vacation
      state:
      - 'off'
  - data:
      message: It looks like a mostly sunny day ahead. Drop the heat by 2 degrees
        to prevent overheating?
      title: ☀️ warm day expected
      data:
        actions:
        - action: APPROVE_TEMP_DROP
          title: Yes, drop temps
        - action: DECLINE_TEMP_DROP
          title: No, leave it
    action: notify.mobile_app_jons_iphone
  - wait_for_trigger:
    - event_type: mobile_app_notification_action
      event_data:
        action: APPROVE_TEMP_DROP
      trigger: event
    - event_type: mobile_app_notification_action
      event_data:
        action: DECLINE_TEMP_DROP
      trigger: event
    timeout: 02:00:00
    continue_on_timeout: false
  - condition: template
    value_template: '{{ wait.trigger.event.data.action == ''APPROVE_TEMP_DROP'' }}'
    alias: if user elects to drop temps
  - target:
      entity_id: input_boolean.solar_offset_active
    action: input_boolean.turn_on
  - target:
      entity_id: climate.infinitude_main_level
    data:
      temperature: 68
    action: climate.set_temperature
  - target:
      entity_id: climate.infinitude_upper_level
    data:
      temperature: 67
    action: climate.set_temperature
  mode: single
