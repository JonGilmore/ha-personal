      - action: alert.turn_off
        entity_id: alert.double_garage_door_open
      - action: notify.mobile_app_jons_iphone
        data:
          title: "\U0001F6AA Double Garage Door"
          message: Closing double garage door...
          data:
            tag: double_garage_door_alert
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == "CLOSE_SINGLE_GARAGE_DOOR"
          }}'
      sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.single_garage_door
        data: {}
      - action: alert.turn_off
        entity_id: alert.single_garage_door_open
      - action: notify.mobile_app_jons_iphone
        data:
          title: "\U0001F6AA Single Garage Door"
