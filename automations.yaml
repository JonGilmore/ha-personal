    input:
      camera:
      - camera.doorbell
      notify_device: a0231187bde1dbfa1db22db7f40ace97
      base_url: https://homeassistant.gilmore.cloud
      message: '{{ label }} detected - {{ camera_name }} at {{event[''after''][''start_time'']|timestamp_custom(''%H:%M'')}}'
