---
double_garage_door_open:
  name: "Double Garage Door Open Alert"
  entity_id: sensor.elkm1_double_garage
  state: "Violated"
  repeat: 20
  can_acknowledge: true
  skip_first: true
  notifiers:
    - mobile_app_jons_iphone
  title: "🚪 Double Garage Door Alert"
  message: "Double garage door is open!"
  data:
    tag: "double_garage_door_alert"
    group: "garage_doors"
    actions:
      - action: "CLOSE_DOUBLE_GARAGE_DOOR"
        title: "close double"
        icon: "sfsymbols:garage.closed"
      - action: "ACKNOWLEDGE_DOUBLE_GARAGE_ALERT"
        title: "acknowledge"
        icon: "sfsymbols:checkmark.circle"
      - action: "SNOOZE_DOUBLE_GARAGE_ALERT"
        title: "snooze 1hr"
        icon: "sfsymbols:clock.badge.checkmark"

