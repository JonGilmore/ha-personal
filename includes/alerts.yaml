---
double_garage_door_open:
  name: "Double Garage Door Open Alert"
  entity_id: sensor.elkm1_double_garage
  state: "Violated"
  repeat: 20
  can_acknowledge: true
  skip_first: true
  notifiers:
    - mobile_app_jons_iphone
  title: "🚪 Double Garage Door Alert"
  message: "Double garage door is open!"
  data:
    tag: "double_garage_door_alert"
    group: "garage_doors"
    actions:
      - action: "CLOSE_DOUBLE_GARAGE_DOOR"
        title: "close double"
        icon: "sfsymbols:garage.closed"
      - action: "ACKNOWLEDGE_DOUBLE_GARAGE_ALERT"
        title: "acknowledge"
        icon: "sfsymbols:checkmark.circle"
      - action: "SNOOZE_DOUBLE_GARAGE_ALERT"
        title: "snooze 1hr"
        icon: "sfsymbols:clock.badge.checkmark"

single_garage_door_open:
  name: "Single Garage Door Open Alert"
  entity_id: sensor.elkm1_single_garage
  state: "Violated"
  repeat: 20
  can_acknowledge: true
  skip_first: true
  notifiers:
    - mobile_app_jons_iphone
  title: "🚪 Single Garage Door Alert"
  message: "Single garage door is open!"
  data:
    tag: "single_garage_door_alert"
    group: "garage_doors"
    actions:
      - action: "CLOSE_SINGLE_GARAGE_DOOR"
        title: "close single"
        icon: "sfsymbols:garage.closed"
      - action: "ACKNOWLEDGE_SINGLE_GARAGE_ALERT"
        title: "acknowledge"
        icon: "sfsymbols:checkmark.circle"
      - action: "SNOOZE_SINGLE_GARAGE_ALERT"
        title: "snooze 1hr"
        icon: "sfsymbols:clock.badge.checkmark"
oven_door_open:
  name: Oven door open
  entity_id: binary_sensor.oven_doors
  state: "on"
  repeat: [15, 5]
  skip_first: true
  can_acknowledge: true
  title: "🔥 Oven open"
  message: >-
    {{ expand('binary_sensor.oven_doors') | selectattr('state', 'eq', 'on')
        | map(attribute='name') | join(', ') }} still open
  done_message: "Oven closed"
  notifiers:
    - mobile_app_jons_iphone
    - mobile_app_lauras_iphone
  data:
    tag: oven_door_open
    push:
      interruption-level: time-sensitive

fridge_door_open:
  name: Fridge door open
  entity_id: binary_sensor.fridge_doors
  state: "on"
  repeat: [4, 2]
  skip_first: true
  can_acknowledge: true
  title: "🧊 Fridge open"
  message: >-
    {{ expand('binary_sensor.fridge_doors') | selectattr('state', 'eq', 'on')
        | map(attribute='name') | join(', ') }} still open
  done_message: "Fridge closed"
  notifiers:
    - mobile_app_jons_iphone
    - mobile_app_lauras_iphone
  data:
    tag: fridge_door_open
    push:
      interruption-level: time-sensitive
