check_lock_health:
  alias: check lock health
  sequence:
  - variables:
      unavailable_locks: "{% set locks = ['lock.garage_lock', 'lock.workshop_lock',
        'lock.mudroom_lock'] %} {% set unavailable = [] %} {% for lock in locks %}\n
        \ {% if states(lock) == 'unavailable' %}\n    {% set unavailable = unavailable
        + [lock.split('.')[1].replace('_lock', '').title()] %}\n  {% endif %}\n{%
        endfor %} {{ unavailable }}\n"
  - condition: template
    value_template: '{{ unavailable_locks | length > 0 }}'
  - action: notify.mobile_app_jons_iphone
    data:
      message: '{{ unavailable_locks | join('', '') }} lock(s) are unavailable. Check
        batteries!'
      title: "\U0001F50B Lock Battery Alert!"
