alarm:
  alias: alarm
  fields:
    alarm_type:
      default: burglar
      description: 'Type of alarm: burglar or fire (defaults to burglar)'
      selector:
        select:
          options:
          - burglar
          - fire
  mode: restart
  sequence:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.alarm_notifier
  - repeat:
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ (alarm_type | default(''burglar'')) == ''fire'' }}'
          sequence:
          - action: notify.mobile_app_jons_iphone
            data:
              data:
                actions:
                - action: ACKNOWLEDGE_FIRE_ALARM
                  destructive: true
                  title: ✅ Acknowledge
                push:
                  interruption-level: critical
                  sound:
                    critical: 1
                    name: default
                    volume: 1
                tag: fire_alarm
              message: Fire alarm active. Tap to acknowledge.
              title: "\U0001F525 FIRE ALARM"
        default:
        - action: notify.mobile_app_jons_iphone
          data:
            data:
              actions:
              - action: DISABLE_BURGLAR_ALARM
                destructive: true
                title: "\U0001F6D1 Disable Alarm"
              push:
                interruption-level: critical
                sound:
                  critical: 1
                  name: default
                  volume: 1
              tag: burglar_alarm
            message: Burglar alarm active. Tap to disable.
            title: "\U0001F6A8 BURGLAR ALARM"
      - delay:
          seconds: 60
      while:
      - condition: state
        entity_id: input_boolean.alarm_notifier
        state: 'on'
