garage_doors_check_and_close:
  alias: Garage Doors Check and Close
  sequence:
  - choose:
      conditions:
        condition: or
        conditions:
        - condition: state
          entity_id: sensor.elkm1_double_garage
          state: Violated
        - condition: state
          entity_id: sensor.elkm1_single_garage
          state: Violated
      sequence:
      - action: notify.mobile_app_jons_iphone
        data:
          message: "{% set double_garage_status = states('sensor.elkm1_double_garage')
            %} {% set single_garage_status = states('sensor.elkm1_single_garage')
            %} {% if double_garage_status == 'Violated' %}\n  Double garage door is
            open.\n{% endif %} {% if single_garage_status == 'Violated' %}\n  Single
            garage door is open.\n{% endif %} {% if double_garage_status == 'Violated'
            and single_garage_status == 'Violated' %}\n  Both garage doors are open.\n{%
            endif %}\n"
      - action: cover.close_cover
        target:
          entity_id:
          - cover.double_garage_door
          - cover.single_garage_door
    default:
    - action: system_log.write
      data:
        level: info
        message: Garage door check was all good, nothing to do because both doors
          are closed.
