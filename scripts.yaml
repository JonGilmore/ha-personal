lock_doors:
  alias: lock doors
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.vacation
        state: 'on'
      sequence:
      - action: notify.mobile_app_jons_iphone
        data:
          message: "Hopefully you dont get locked out... \U0001F480"
          title: "\U0001F512 Vacation is on, locked all doors"
      - delay: 00:01:30
      - action: lock.lock
        continue_on_error: true
        target:
          entity_id:
          - lock.garage_lock
          - lock.workshop_lock
          - lock.mudroom_lock
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.number_of_non_vacation_doors_unlocked
          above: 0
        - condition: state
          entity_id:
          - lock.garage_lock
          - lock.workshop_lock
          - lock.mudroom_lock
          state: unavailable
          match: any
      sequence:
      - action: notify.mobile_app_jons_iphone
        data:
          message: "{% set unlocked = states('sensor.non_vacation_doors_unlocked')
            %}{% set unavailable_locks = [\n  states('lock.garage_lock') == 'unavailable'
            and 'Garage',\n  states('lock.workshop_lock') == 'unavailable' and 'Workshop',\n
            \ states('lock.mudroom_lock') == 'unavailable' and 'Mudroom'\n] | select
            | list %}{% if unlocked not in ['', 'none', 'unknown', 'unavailable']
            %}\n  Locking {{ unlocked }}\n{% endif %}{% if unavailable_locks %}\n
            \ ⚠️ Warning: {{ unavailable_locks | join(', ') }} lock(s) unavailable
            (dead battery?)\n{% endif %}\n"
          title: "\U0001F512 Locking doors..."
      - action: lock.lock
        continue_on_error: true
        target:
          entity_id:
          - lock.workshop_lock
          - lock.mudroom_lock
    default:
    - action: system_log.write
      data:
        level: info
        message: Leaving, all locks are secured or unavailable.
