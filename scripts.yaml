tv_remote_press:
  alias: 'TV Remote: Press'
  description: 'Sends a remote key to the TV chosen in input_select.tv_remote_target
    (or the ''tv'' field). LG (Glasshouse): presses button.<tv>_<key> (''mute'' toggles
    switch.<tv>_mute). Roku (office, workshop): remote.send_command on remote.<tv>_tv.
    Samsung Frame (main_bedroom): KEY_* via remote.samsung_the_frame_55; play_pause
    via media_player.media_play_pause.'
  icon: mdi:remote-tv
  mode: queued
  max: 20
  fields:
    key:
      name: Key
      required: true
      selector:
        select:
          custom_value: true
          options:
          - remote_up
          - remote_down
          - remote_left
          - remote_right
          - remote_ok
          - remote_back
          - remote_home
          - play
          - pause
          - play_pause
          - stop
          - volume_up
          - volume_down
          - mute
          - power_on_tv
          - power_off_tv
          - restart_tv
          - start_screensaver
    tv:
      name: TV prefix
      description: Optional. Defaults to the TV Remote Target selection.
      required: false
      selector:
        text: {}
  sequence:
  - variables:
      target: '{{ tv if tv is defined and tv else states(''input_select.tv_remote_target'')
        }}'
      roku_keys:
        remote_up: up
        remote_down: down
        remote_left: left
        remote_right: right
        remote_ok: select
        remote_back: back
        remote_home: home
        play: play
        pause: play
        play_pause: play
        volume_up: volume_up
        volume_down: volume_down
        mute: volume_mute
        power_on_tv: power
        power_off_tv: power
      samsung_keys:
        remote_up: KEY_UP
        remote_down: KEY_DOWN
        remote_left: KEY_LEFT
        remote_right: KEY_RIGHT
        remote_ok: KEY_ENTER
        remote_back: KEY_RETURN
        remote_home: KEY_HOME
        play: KEY_PLAY
        pause: KEY_PAUSE
        stop: KEY_STOP
        volume_up: KEY_VOLUP
        volume_down: KEY_VOLDOWN
        mute: KEY_MUTE
  - choose:
    - alias: Roku
      conditions:
      - condition: template
        value_template: '{{ target in [''office'', ''workshop''] }}'
      sequence:
      - condition: template
        value_template: '{{ key in roku_keys }}'
        alias: skip keys Roku doesn't have
      - action: remote.send_command
        target:
          entity_id: remote.{{ target }}_tv
        data:
          command: '{{ roku_keys[key] }}'
    - alias: Samsung Frame
      conditions:
      - condition: template
        value_template: '{{ target == ''main_bedroom'' }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ key == ''play_pause'' }}'
        then:
        - action: media_player.media_play_pause
          target:
            entity_id: media_player.main_bedroom_tv
        else:
        - condition: template
          value_template: '{{ key in samsung_keys }}'
          alias: skip keys the Frame doesn't have
        - action: remote.send_command
          target:
            entity_id: remote.samsung_the_frame_55
          data:
            command: '{{ samsung_keys[key] }}'
    - alias: LG mute
      conditions:
      - condition: template
        value_template: '{{ key == ''mute'' }}'
      sequence:
      - action: switch.toggle
        target:
          entity_id: switch.{{ target }}_mute
    default:
    - action: button.press
      target:
        entity_id: button.{{ target }}_{{ key }}
tv_remote_power:
  alias: 'TV Remote: Power Toggle'
  description: 'Toggles power on the selected LG TV. Off: presses power_off_tv. On:
    Wake-on-LAN (MAC from the map below, falling back to the device registry), then
    power_on_tv if the TV is in Active Standby. Add new TVs to the ''macs'' map. Roku
    (office, workshop): media_player.toggle. Samsung Frame (main_bedroom): turn_off
    when on, Wake-on-LAN when off.'
  icon: mdi:power
  mode: single
  fields:
    tv:
      name: TV prefix
      description: Optional. Defaults to the TV Remote Target selection.
      required: false
      selector:
        text: {}
  sequence:
  - variables:
      macs:
        sunroom: 74:e6:b8:a5:b4:9a
        great_room: 74:e6:b8:a5:b5:00
        gym: 74:e6:b8:4a:72:31
        media_room: 74:e6:b8:c3:5c:95
        garage: a8:23:fe:0c:92:af
      target: '{{ tv if tv is defined and tv else states(''input_select.tv_remote_target'')
        }}'
      did: '{{ device_id(''binary_sensor.'' ~ target ~ ''_power'') }}'
      mac: '{{ macs.get(target) or ((device_attr(did, ''connections'') | selectattr(''0'',
        ''eq'', ''mac'') | map(attribute=''1'') | first | default('''')) if did else
        '''') }}'
  - alias: Roku
    if:
    - condition: template
      value_template: '{{ target in [''office'', ''workshop''] }}'
    then:
    - action: media_player.toggle
      target:
        entity_id: media_player.{{ target }}_tv
    - stop: Roku handled
  - alias: Samsung Frame
    if:
    - condition: template
      value_template: '{{ target == ''main_bedroom'' }}'
    then:
    - if:
      - condition: state
        entity_id: media_player.main_bedroom_tv
        state: 'on'
      then:
      - action: media_player.turn_off
        target:
          entity_id: media_player.main_bedroom_tv
      else:
      - action: wake_on_lan.send_magic_packet
        continue_on_error: true
        data:
          mac: 80:47:86:c6:ed:7d
    - stop: Samsung handled
  - if:
    - condition: template
      value_template: '{{ is_state(''binary_sensor.'' ~ target ~ ''_power'', ''on'')
        }}'
    then:
    - action: button.press
      target:
        entity_id: button.{{ target }}_power_off_tv
    else:
    - alias: Wake from standby
      if:
      - condition: template
        value_template: '{{ mac != '''' }}'
      then:
      - action: wake_on_lan.send_magic_packet
        continue_on_error: true
        data:
          mac: '{{ mac }}'
    - alias: Wake from Active Standby
      if:
      - condition: template
        value_template: '{{ has_value(''button.'' ~ target ~ ''_power_on_tv'') }}'
      then:
      - action: button.press
        continue_on_error: true
        target:
          entity_id: button.{{ target }}_power_on_tv
all_echos_on_off:
  alias: all echos on/off
  mode: queued
  icon: mdi:television
  fields:
    power:
      description: on or off
      required: true
      selector:
        select:
          options:
          - 'on'
          - 'off'
    entities:
      description: Optional override of the default list
      selector:
        entity:
          multiple: true
  variables:
    default_entities:
    - light.show_screen
    - light.kitchen_screen
    targets: '{{ entities if entities is defined and entities | count > 0 else default_entities
      }}

      '
  sequence:
  - condition: template
    value_template: '{{ power in [''on'', ''off''] }}'
  - action: homeassistant.turn_{{ power }}
    target:
      entity_id: '{{ targets }}'
